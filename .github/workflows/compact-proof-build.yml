name: Compact proof build

on:
  workflow_dispatch:
  push:
    paths:
      - "contracts/**"
      - "managed/**"
      - ".github/workflows/compact-proof-build.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "managed/**"
      - ".github/workflows/compact-proof-build.yml"

permissions:
  contents: read

jobs:
  compile:
    name: Compile Compact contract and proving keys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPACT_VERSION: 0.31.1
      COMPACT_ARCHIVE: compactc_v0.31.1_x86_64-unknown-linux-musl.zip
      COMPACT_URL: https://github.com/midnightntwrk/compact/releases/download/compactc-v0.31.1/compactc_v0.31.1_x86_64-unknown-linux-musl.zip
      CONTRACT_SOURCE: contracts/aegis_bid.compact
      OUTPUT_DIRECTORY: .compact-build

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned Compact compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$COMPACT_ARCHIVE" "$COMPACT_URL"
          unzip -q "$RUNNER_TEMP/$COMPACT_ARCHIVE" -d "$RUNNER_TEMP/compact"
          sudo install -m 0755 "$RUNNER_TEMP/compact/compactc" /usr/local/bin/compactc
          sudo install -m 0755 "$RUNNER_TEMP/compact/compactc.bin" /usr/local/bin/compactc.bin
          sudo install -m 0755 "$RUNNER_TEMP/compact/fixup-compact" /usr/local/bin/fixup-compact
          sudo install -m 0755 "$RUNNER_TEMP/compact/format-compact" /usr/local/bin/format-compact
          sudo install -m 0755 "$RUNNER_TEMP/compact/zkir" /usr/local/bin/zkir
          sudo install -m 0755 "$RUNNER_TEMP/compact/zkir-v3" /usr/local/bin/zkir-v3
          compactc --version

      - name: Compile contract and generate proving keys
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIRECTORY"
          compactc "$CONTRACT_SOURCE" "$OUTPUT_DIRECTORY"
          test -f "$OUTPUT_DIRECTORY/contract-info.json"
          find "$OUTPUT_DIRECTORY" -type f -print | sort

      - name: Retain generated artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-bid-compact-build
          path: .compact-build
          if-no-files-found: ignore
          retention-days: 7
